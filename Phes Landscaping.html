<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phes Landscaping — Huntsville, AL</title>
<link rel="stylesheet" href="colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--cream); }
  #site { height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--n-300); border-radius: 999px; }
  /* Floating call button */
  .call-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 80;
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--font-sans); font-weight: 700; font-size: 15px;
    color: #fff; text-decoration: none;
    background: var(--fern); padding: 14px 22px; border-radius: var(--r-pill);
    box-shadow: var(--shadow-lg);
    transition: background var(--dur-fast), transform var(--dur-fast);
  }
  .call-fab:hover { background: var(--leaf); transform: translateY(-2px); }
  .call-fab:active { background: var(--pine); transform: translateY(0); }
</style>
</head>
<body>
  <div id="root"></div>
  <template id="__bundler_thumbnail" data-bg-color="#16301F">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#16301F"/>
      <path d="M600 250c-70 0-120 55-120 130 0 90 70 150 120 200 50-50 120-110 120-200 0-75-50-130-120-130z" fill="#3E8C57"/>
      <path d="M600 300v260" stroke="#16301F" stroke-width="10" stroke-linecap="round"/>
      <path d="M600 420c-30-20-60-15-80-35M600 470c30-20 60-15 80-35" stroke="#16301F" stroke-width="10" stroke-linecap="round" fill="none"/>
      <text x="600" y="650" font-family="Georgia, serif" font-size="76" font-weight="600" fill="#F6F2E9" text-anchor="middle">Phes</text>
      <text x="600" y="700" font-family="sans-serif" font-size="20" letter-spacing="12" fill="#B6C68C" text-anchor="middle">LANDSCAPING</text>
    </svg>
  </template>
  <script type="text/babel" src="site/Primitives.jsx"></script>
  <script type="text/babel" src="site/Nav.jsx"></script>
  <script type="text/babel" src="site/Services.jsx"></script>
  <script type="text/babel" src="site/Gallery.jsx"></script>
  <script type="text/babel" src="site/About.jsx"></script>
  <script type="text/babel" src="site/QuoteForm.jsx"></script>
  <script type="text/babel" data-presets="react">
    function CallFab() {
      return (
        <a className="call-fab" href={PHONE_TEL} aria-label={'Call Phes Landscaping at ' + PHONE_DISPLAY}>
          <Icon name="phone" size={17} /> Call us
        </a>
      );
    }
    function App() {
      const goQuote = () => {
        const el = document.getElementById('quote');
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth' });
      };
      return (
        <div id="site" data-screen-label="Homepage">
          <Nav onQuote={goQuote} />
          <Hero onQuote={goQuote} />
          <Services />
          <Gallery />
          <About />
          <Testimonials />
          <QuoteForm />
          <Footer />
          <CallFab />
        </div>
      );
    }
    const mount = () => {
      if (!window.Nav || !window.Hero || !window.Services || !window.Gallery || !window.About || !window.Testimonials || !window.QuoteForm || !window.Footer) {
        return setTimeout(mount, 30);
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      if (window.lucide) window.lucide.createIcons();
    };
    mount();
  </script>
</body>
</html>
